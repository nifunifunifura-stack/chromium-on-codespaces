services:
  chrome:
    image: kasmweb/chrome:1.18.0
    container_name: codespace-chrome
    shm_size: "1gb"
    environment:
      VNC_PW: "${BROWSER_PASSWORD:?Set BROWSER_PASSWORD in .env}"
      APP_ARGS: "--disable-session-crashed-bubble"
      KASM_RESTRICTED_FILE_CHOOSER: "false"
    volumes:
      - ./browser-data:/home/kasm-user
      - ./browser-files:/workspace:ro
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
