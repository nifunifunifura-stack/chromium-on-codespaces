services:
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    container_name: codespace-chromium
    shm_size: "1gb"
    environment:
      CUSTOM_USER: "${BROWSER_USER:?Set BROWSER_USER in .env}"
      PASSWORD: "${BROWSER_PASSWORD:?Set BROWSER_PASSWORD in .env}"
      TITLE: "Codespace Chromium"
      TZ: "Etc/UTC"
      CHROME_CLI: "--disable-session-crashed-bubble"
    volumes:
      - ./browser-data:/config
      - ./browser-files:/workspace:ro
      - ./codespaces-chromium/halve-scroll-sensitivity.sh:/custom-cont-init.d/50-halve-scroll-sensitivity.sh:ro
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
