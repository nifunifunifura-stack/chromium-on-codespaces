services:
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    container_name: codespaces-chromium
    shm_size: "1gb"
    environment:
      CUSTOM_USER: "${BROWSER_USER:?Set BROWSER_USER in the generated credentials file}"
      PASSWORD: "${BROWSER_PASSWORD:?Set BROWSER_PASSWORD in the generated credentials file}"
      TITLE: "Codespace Chromium"
      TZ: "Etc/UTC"
      CHROME_CLI: "--disable-session-crashed-bubble"
    volumes:
      - ./browser-data:/config
      - type: bind
        source: ${WORKSPACE_FILES_DIR:?Set by codespaces-chromium/setup.sh}
        target: /workspace
        read_only: true
    ports:
      - "3002:3000"
    restart: unless-stopped
    stop_grace_period: 30s
