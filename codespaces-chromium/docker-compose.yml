services:
  chrome:
    image: kasmweb/chrome:1.18.0
    container_name: codespaces-chrome
    shm_size: "1gb"
    environment:
      VNC_PW: "${BROWSER_PASSWORD:?Set BROWSER_PASSWORD in the generated credentials file}"
      APP_ARGS: "--disable-session-crashed-bubble"
      KASM_RESTRICTED_FILE_CHOOSER: "false"
    volumes:
      - type: bind
        source: ${WORKSPACE_BROWSER_DATA_DIR:?Set by codespaces-chromium/setup.sh}
        target: /home/kasm-user
      - type: bind
        source: ${WORKSPACE_FILES_DIR:?Set by codespaces-chromium/setup.sh}
        target: /workspace
        read_only: true
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
